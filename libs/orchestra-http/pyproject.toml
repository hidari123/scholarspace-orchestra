[project]
name = "orchestra-http"
version = "0.1.0"
description = "scholarspace 编排引擎 HTTP 接口层 —— FastAPI 路由 + SSE"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Proprietary" }

# ⚠️ HTTP 层依赖 core + runtime（同仓本地包）
dependencies = [
    "orchestra-core",
    "orchestra-runtime",
    "fastapi>=0.115",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.9",
    "mypy>=1.14",
]

[tool.uv.sources]
orchestra-core = { path = "../orchestra-core", editable = true }
orchestra-runtime = { path = "../orchestra-runtime", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestra_http"]

[tool.hatch.build.targets.sdist]
include = ["src/orchestra_http", "README.md"]

[tool.ruff]
extend = "./ruff.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
addopts = "-ra --strict-markers --tb=short"

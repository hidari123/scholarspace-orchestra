[project]
name = "orchestra-core"
version = "0.1.0"
description = "scholarspace 编排引擎 —— 领域模型与 DAG 调度"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Proprietary" }

# ⚠️ 领域层零依赖 —— 编排的核心概念可以独立复用。
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
    "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestra_core"]

[tool.hatch.build.targets.sdist]
include = ["src/orchestra_core", "README.md"]

[tool.ruff]
extend = "./ruff.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
addopts = "-ra --strict-markers --tb=short"
